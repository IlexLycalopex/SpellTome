name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build new site (served under /next/)
        working-directory: site
        env:
          SITE_BASE: /next
        run: |
          npm ci
          npm run build

      - name: Assemble Pages artifact (old site at /, new site at /next/)
        run: |
          mkdir -p _pages
          rsync -a \
            --exclude '_pages' \
            --exclude 'site' \
            --exclude '_src' \
            --exclude 'docs' \
            --exclude 'supabase' \
            --exclude 'scripts' \
            --exclude '.github' \
            --exclude '.git' \
            ./ _pages/
          mkdir -p _pages/next
          rsync -a site/dist/ _pages/next/
          touch _pages/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
